name: Build Fishing in Greece APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project
        run: |
          mkdir extracted-project
          unzip -q Fishing-in-Greece.zip -d extracted-project

      - name: Build APK
        run: gradle -p extracted-project :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fishing-in-Greece-APK
          path: extracted-project/app/build/outputs/apk/debug/app-debug.apk
